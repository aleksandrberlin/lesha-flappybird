<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy Lesha — 8-bit</title>

<body>
  <main class="wrap">
    <canvas id="game" width="320" height="480" aria-label="Flappy Lesha"></canvas>

      <b>Space</b> / <b>клик</b> / <b>тап</b> — взмах &nbsp;·&nbsp; <b>P</b> — пауза &nbsp;·&nbsp;
      <b>M</b> — звук &nbsp;·&nbsp; <b>R</b> — заново
    </p>

  </main>
  <script src="src/assets-data.js"></script>
